<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ModPicker data health</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="enhancements.css"></head><body><main class="shell" style="padding:40px 20px"><a href="index.html">← Back to ModPicker</a><h1>Data pipeline health</h1><p>Scheduled collection every six hours. No ChatGPT or AI curation dependency.</p><div id="health" class="ranking-summary"></div><p id="freshness"></p><pre id="details" style="white-space:pre-wrap;background:#11161d;padding:20px;border-radius:14px;overflow:auto"></pre></main><script>fetch('data/live/status.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(s=>{const stale=Date.now()-Date.parse(s.generated_at)>12*3600000;document.getElementById('health').innerHTML=`<div><span>Status</span><strong>${stale?'Stale':s.ok?'Healthy':'Partial coverage'}</strong></div><div><span>Products</span><strong>${Number(s.catalog_part_count)||0}</strong></div><div><span>Sources</span><strong>${Number(s.source_count)||0}</strong></div><div><span>Offers</span><strong>${Number(s.offer_count)||0}</strong></div>`;document.getElementById('freshness').textContent='Last refresh: '+new Date(s.generated_at).toLocaleString()+'. Warnings below identify blocked or unavailable sources.';document.getElementById('details').textContent=JSON.stringify(s,null,2)}).catch(e=>document.getElementById('details').textContent='Status unavailable: '+e)</script></body></html>
