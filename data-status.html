<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ModPicker Data Health</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="enhancements.css"></head><body><main class="shell" style="padding:40px 20px"><span class="eyebrow">ModPicker operations</span><h1>Data pipeline health</h1><p>This page reads the latest generated pipeline status committed by GitHub Actions.</p><div id="health" class="ranking-summary"></div><pre id="details" style="white-space:pre-wrap;background:#11161d;padding:20px;border-radius:14px;overflow:auto"></pre></main><script>fetch('data/live/status.json',{cache:'no-store'}).then(r=>r.json()).then(s=>{health.innerHTML=`<div><span>Status</span><strong>${s.ok?'Healthy':'Attention'}</strong></div><div><span>Sources</span><strong>${s.source_count||0}</strong></div><div><span>Offers</span><strong>${s.offer_count||0}</strong></div><div><span>Review queue</span><strong>${s.review_queue_count||0}</strong></div>`;details.textContent=JSON.stringify(s,null,2)}).catch(e=>details.textContent='Pipeline status unavailable: '+e)</script></body></html>
