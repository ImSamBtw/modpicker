name: Refresh ModPicker production data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'collectors/**'
      - 'curators/**'
      - 'config/**'
      - 'data/seed/**'
      - 'requirements.txt'
      - '.github/workflows/data-pipeline.yml'
permissions:
  contents: write
  id-token: write
concurrency:
  group: modpicker-data-pipeline
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect and normalize data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL }}
        run: python -m pipeline.run
      - name: Sync normalized data to Supabase with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=modpicker-supabase" > /tmp/oidc.json
          python - <<'PY'
          import json
          from pathlib import Path
          token=json.loads(Path('/tmp/oidc.json').read_text())['value']
          Path('/tmp/oidc-token').write_text(token)
          payload={
              'parts': json.loads(Path('data/live/catalog.json').read_text()),
              'candidates': json.loads(Path('data/live/catalog_candidates.json').read_text()),
              'sources': json.loads(Path('data/live/sources.json').read_text()),
              'offers': json.loads(Path('data/live/offers.json').read_text()),
              'status': json.loads(Path('data/live/status.json').read_text()),
          }
          Path('/tmp/modpicker-payload.json').write_text(json.dumps(payload,separators=(',',':')))
          PY
          OIDC_TOKEN="$(cat /tmp/oidc-token)"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/modpicker-payload.json \
            https://pzxofwrdidvqhdlqbehk.supabase.co/functions/v1/ingest-github-pipeline
      - name: Commit changed data
        run: |
          git config user.name 'modpicker-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/live pipeline-data.js
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh catalog, sources and offers'
          git push
