name: Validate ModPicker changes

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Validate manual catalog inputs
        run: python scripts/validate_catalog.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check app-v2.js
          node --check garage-ui.js
          node --check garage.js
          node --check garage-planner.js
          node --check interchange.js
          node --check ui-polish.js
          node --check research.js
          node --check trust-ui.js
          node --check tests/browser-maintenance-a11y.cjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: node tests/browser-smoke.cjs
      - name: Run maintenance and keyboard browser test
        run: node tests/browser-maintenance-a11y.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ github.run_id }}
          path: /tmp/modpicker-*.png
          if-no-files-found: ignore
