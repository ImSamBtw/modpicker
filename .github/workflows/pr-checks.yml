name: Validate ModPicker pull requests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Validate manual catalog inputs
        run: python scripts/validate_catalog.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check app-v2.js
          node --check garage-ui.js
          node --check garage.js
          node --check garage-planner.js
          node --check interchange.js
          node --check research.js
          node --check trust-ui.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: node tests/browser-smoke.cjs
