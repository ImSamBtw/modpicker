name: Validate Dream Spec changes

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Validate manual catalog inputs
        run: python scripts/validate_catalog.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check app-v2.js
          node --check pipeline-bridge.js
          node --check garage-ui.js
          node --check garage.js
          node --check garage-planner.js
          node --check interchange.js
          node --check ui-polish.js
          node --check research.js
          node --check trust-ui.js
      - name: Dream Spec syntax and backend/core regression
        run: |
          node --check ds-auth.js
          node --check ds-owned.js
          node --check ds-hub.js
          node --check ds-core.js
          node --check ds-appearance.js
          node --check supabase/functions/dreamspec-diagnose/handler.mjs
          node tests/dreamspec-core.cjs
          node tests/dreamspec-backend.mjs
      - name: Vehicle make trust regression
        run: node tests/vehicle-make-trust.cjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: node tests/browser-smoke.cjs
      - name: Garage regression smoke test
        run: node tests/garage-smoke.cjs
      - name: Home and progressive-disclosure regression
        run: node tests/ui-cleanup-smoke.cjs
      - name: Dream Spec account, theme and hub regression
        run: node tests/dreamspec-browser.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ github.run_id }}
          path: |
            /tmp/modpicker-*.png
            /tmp/dreamspec-*.png
          if-no-files-found: ignore
