name: Dream Spec data isolation
on:
  pull_request:
    paths: ['supabase/**', 'tests/dreamspec-rls.sql', '.github/workflows/dreamspec-rls.yml']
  push:
    branches-ignore: [main]
    paths: ['supabase/**', 'tests/dreamspec-rls.sql', '.github/workflows/dreamspec-rls.yml']
permissions:
  contents: read
jobs:
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dreamspec_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Test actual PostgreSQL ownership policies and migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d dreamspec_test -f tests/dreamspec-rls.sql
